plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }
android {
    namespace 'org.androidaudioplugin.sfz.salamanderdrumkit'
    compileSdk 37
    defaultConfig {
        applicationId 'org.androidaudioplugin.sfz.salamanderdrumkit'
        minSdk 29
        targetSdk 37
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    // Every published resource must support AssetManager.openFd().
    androidResources {
        noCompress ''
        ignoreAssetsPattern 'salamanderDrumkit'
    }
    buildFeatures { compose true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    kotlinOptions { jvmTarget = '11' }
}
dependencies {
    implementation project(':sfz-provider')
    implementation platform('androidx.compose:compose-bom:2026.04.01')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.material3:material3'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'junit:junit:4.13.2'
}
