plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.compose.compiler)
}
android {
    namespace = 'org.androidaudioplugin.sfz.salamanderdrumkit'
    compileSdk = libs.versions.android.compileSdk.get().toInteger()
    defaultConfig {
        applicationId = 'org.androidaudioplugin.sfz.salamanderdrumkit'
        minSdk = libs.versions.android.minSdk.get().toInteger()
        targetSdk = libs.versions.android.targetSdk.get().toInteger()
        // 2.x serves the soundpack contract; 1.x served SfzResourceService.V1.
        versionCode = 2
        versionName = '2.0.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }
    // Pack files are served as descriptor ranges of the APK, so nothing may be compressed.
    androidResources {
        noCompress ''
        ignoreAssetsPattern = 'salamanderDrumkit'
    }
    buildFeatures { compose = true }
    compileOptions { sourceCompatibility = JavaVersion.VERSION_11; targetCompatibility = JavaVersion.VERSION_11 }
}
dependencies {
    implementation libs.soundpack.provider.sdk
    implementation platform(libs.compose.bom)
    implementation libs.activity.compose
    implementation libs.compose.material3
    androidTestImplementation libs.soundpack.testkit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.junit
}
