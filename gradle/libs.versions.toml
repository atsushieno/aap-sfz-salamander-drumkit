[versions]
agp = "9.4.1"
kotlin = "2.3.21"

android-compileSdk = "37"
android-minSdk = "29"
android-targetSdk = "37"

soundpack = "0.1.0-dev"
compose-bom = "2026.04.01"
activity-compose = "1.13.0"
test-runner = "1.7.0"
junit = "4.13.2"

[libraries]
soundpack-provider-sdk = { module = "org.androidaudioplugin.soundpack:soundpack-provider-sdk", version.ref = "soundpack" }
soundpack-testkit = { module = "org.androidaudioplugin.soundpack:soundpack-testkit", version.ref = "soundpack" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
